  <path d="M0 316 Q90 280 180 312 T400 296 V400 H0Z" fill="#1d2150"/>
  <path d="M0 350 Q120 318 240 346 T400 336 V400 H0Z" fill="#141842"/>
  <path d="M118 340 C112 316 132 300 160 304 C190 298 214 306 218 330 C222 346 206 352 170 352 C136 352 122 350 118 340Z" fill="#8a8fa8"/>
  <path d="M138 318 C148 308 168 308 180 314 C168 320 150 322 138 318Z" fill="#a9aec6"/>
