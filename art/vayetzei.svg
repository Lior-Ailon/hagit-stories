  <g fill="#fff6dc" opacity=".95"><ellipse cx="200" cy="64" rx="64" ry="20"/><ellipse cx="160" cy="70" rx="34" ry="16"/><ellipse cx="244" cy="70" rx="36" ry="16"/><ellipse cx="200" cy="52" rx="34" ry="16"/></g>
  <g stroke="#ffe08a" stroke-width="9" stroke-linecap="round"><line x1="168" y1="76" x2="136" y2="318"/><line x1="232" y1="76" x2="264" y2="318"/></g>
  <g stroke="#fff3c4" stroke-width="6" stroke-linecap="round">
    <line x1="165" y1="104" x2="235" y2="104"/><line x1="162" y1="136" x2="238" y2="136"/><line x1="158" y1="170" x2="242" y2="170"/><line x1="154" y1="206" x2="246" y2="206"/>
    <line x1="150" y1="242" x2="250" y2="242"/><line x1="145" y1="280" x2="255" y2="280"/>
  </g>
  <use href="#spark" x="124" y="196" fill="#fff3c4"/><use href="#spark" x="280" y="150" fill="#fff3c4" transform="translate(280 150) scale(.8) translate(-280 -150)"/><use href="#spark" x="276" y="250" fill="#fff3c4" transform="translate(276 250) scale(.65) translate(-276 -250)"/><use href="#spark" x="120" y="120" fill="#fff3c4" transform="translate(120 120) scale(.6) translate(-120 -120)"/>
