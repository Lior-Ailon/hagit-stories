<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="סולם זוהר עולה לשמיים מלאי כוכבים, ואבן בתחתיתו">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#16225a"/><stop offset=".6" stop-color="#3a3586"/><stop offset="1" stop-color="#6b4f9a"/></linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffe9a0" stop-opacity=".95"/><stop offset="1" stop-color="#ffe9a0" stop-opacity="0"/></radialGradient>
    <path id="spark" d="M0 -9 L2.2 -2.2 L9 0 L2.2 2.2 L0 9 L-2.2 2.2 L-9 0 L-2.2 -2.2Z"/>
  </defs>
  <rect width="400" height="400" fill="url(#sky)"/>
  <g fill="#fff"><circle cx="40" cy="50" r="1.8"/><circle cx="92" cy="110" r="1.4"/><circle cx="150" cy="40" r="2"/><circle cx="238" cy="70" r="1.6"/><circle cx="340" cy="42" r="2"/><circle cx="366" cy="120" r="1.5"/><circle cx="60" cy="180" r="1.5"/><circle cx="330" cy="190" r="1.7"/><circle cx="118" cy="160" r="1.2"/><circle cx="280" cy="140" r="1.3"/><circle cx="20" cy="118" r="1.4"/></g>
  <use href="#spark" x="70" y="76" fill="#ffe9a0"/><use href="#spark" x="318" y="84" fill="#ffe9a0" transform="translate(318 84) scale(.8) translate(-318 -84)"/><use href="#spark" x="196" y="28" fill="#ffe9a0" transform="translate(196 28) scale(.7) translate(-196 -28)"/>
  <!-- crescent moon -->
