<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="טל מן השמיים, זיתים, חיטה, ענבים וקנקן שמן: סמלי הברכה">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bfe0ff"/><stop offset=".6" stop-color="#fff1cf"/><stop offset="1" stop-color="#ffe6b0"/></linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff6c4"/><stop offset=".5" stop-color="#ffe27a" stop-opacity=".7"/><stop offset="1" stop-color="#ffe27a" stop-opacity="0"/></radialGradient>
    <path id="drop" d="M0 -14 C8 -2 10 4 0 12 C-10 4 -8 -2 0 -14Z"/>
    <g id="wheat"><path d="M0 0 V-58" stroke="#c9a23a" stroke-width="3" stroke-linecap="round"/>
      <g fill="#e9c24c"><ellipse cx="-5" cy="-60" rx="3.6" ry="8" transform="rotate(-22 -5 -60)"/><ellipse cx="5" cy="-60" rx="3.6" ry="8" transform="rotate(22 5 -60)"/><ellipse cx="0" cy="-70" rx="3.6" ry="9"/>
      <ellipse cx="-5" cy="-46" rx="3.4" ry="7.5" transform="rotate(-22 -5 -46)"/><ellipse cx="5" cy="-46" rx="3.4" ry="7.5" transform="rotate(22 5 -46)"/></g></g>
  </defs>
  <rect width="400" height="400" fill="url(#sky)"/>
  <circle cx="200" cy="40" r="150" fill="url(#glow)"/>
  <!-- dew falling from the sky -->
  <g fill="#8fd0ff" opacity=".9">
    <use href="#drop" x="90" y="80"/><use href="#drop" x="150" y="130" transform="translate(150 130) scale(.8) translate(-150 -130)"/><use href="#drop" x="214" y="70"/>
    <use href="#drop" x="270" y="125" transform="translate(270 125) scale(.9) translate(-270 -125)"/><use href="#drop" x="330" y="86" transform="translate(330 86) scale(.75) translate(-330 -86)"/>
    <use href="#drop" x="48" y="140" transform="translate(48 140) scale(.7) translate(-48 -140)"/><use href="#drop" x="190" y="166" transform="translate(190 166) scale(.7) translate(-190 -166)"/>
  </g>
  <g fill="#fff" opacity=".8"><circle cx="86" cy="76" r="2.6"/><circle cx="210" cy="66" r="2.6"/><circle cx="326" cy="82" r="2.2"/></g>
  <path d="M0 262 Q110 224 210 256 T400 244 V400 H0Z" fill="#cfe39a"/>
  <path d="M0 304 Q140 270 260 300 T400 292 V400 H0Z" fill="#a6cf6f"/>
  <path d="M0 348 Q120 322 240 344 T400 336 V400 H0Z" fill="#e6c46a"/>
  <!-- olive tree -->
  <g transform="translate(96 262)"><path d="M-7 0 C-6 -22 -2 -30 -3 -44 L7 -44 C6 -30 10 -22 9 0Z" fill="#7a5638"/>
    <circle cx="0" cy="-62" r="34" fill="#8fae5a"/><circle cx="-26" cy="-46" r="22" fill="#7d9d4c"/><circle cx="26" cy="-46" r="22" fill="#9bba66"/>
    <g fill="#4a3a52"><ellipse cx="-14" cy="-60" rx="4" ry="5.5"/><ellipse cx="12" cy="-72" rx="4" ry="5.5"/><ellipse cx="22" cy="-52" rx="4" ry="5.5"/><ellipse cx="-30" cy="-44" rx="4" ry="5.5"/><ellipse cx="2" cy="-46" rx="4" ry="5.5"/></g></g>
  <!-- wheat -->
  <use href="#wheat" transform="translate(206 330)"/><use href="#wheat" transform="translate(228 338) scale(.92)"/><use href="#wheat" transform="translate(184 340) scale(.9)"/>
  <!-- grapes -->
  <g transform="translate(300 268)"><path d="M-2 -40 C0 -28 0 -22 -2 -14" stroke="#6f9d42" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M0 -42 C14 -52 30 -48 36 -36 C20 -34 8 -32 0 -42Z" fill="#7fae4e"/>
    <g fill="#7a4fb0"><circle cx="-14" cy="-10" r="10"/><circle cx="6" cy="-10" r="10"/><circle cx="26" cy="-10" r="10"/><circle cx="-4" cy="8" r="10"/><circle cx="16" cy="8" r="10"/><circle cx="6" cy="26" r="10"/></g>
    <g fill="#c9a7f0" opacity=".7"><circle cx="-17" cy="-14" r="3"/><circle cx="3" cy="-14" r="3"/><circle cx="23" cy="-14" r="3"/><circle cx="-7" cy="4" r="3"/><circle cx="13" cy="4" r="3"/></g></g>
  <!-- jug of oil -->
  <g transform="translate(352 326)"><path d="M-14 -44 C-26 -34 -28 -6 -16 8 C-8 14 8 14 16 8 C28 -6 26 -34 14 -44Z" fill="#c98b52"/>
    <rect x="-9" y="-58" width="18" height="16" rx="4" fill="#a96d3a"/><path d="M-20 -30 C-30 -28 -30 -12 -20 -10" fill="none" stroke="#a96d3a" stroke-width="5" stroke-linecap="round"/>
    <path d="M-14 -22 C-6 -18 6 -18 14 -22" fill="none" stroke="#f3d28b" stroke-width="4" stroke-linecap="round"/></g>
</svg>
