<style>body{margin:0;font-family:'Assistant',sans-serif;background:#fffdf7;color:#3d3a4a}
.wrap{max-width:760px;margin:0 auto;padding:26px 18px}
.hero{text-align:center}.logo{font-family:'Varela Round';font-size:38px}.tag{color:#8b8496}
.card{background:rgba(255,253,247,.94);border:2px solid #e6d7bd;border-radius:22px;padding:22px;margin:18px 0;box-shadow:0 8px 26px rgba(120,90,50,.12)}
</style>
<style>/* ===== מסגרת ארץ ישראל: רקע מכל הכיוונים + קדימה ===== */
#landMosaic{position:fixed;inset:0;z-index:-3;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);gap:3px;opacity:.9}
#landMosaic img{width:100%;height:100%;object-fit:cover;filter:saturate(1.02) contrast(1.02);animation:kb 30s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1.02)}to{transform:scale(1.14)}}
#landMosaic::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(252,246,233,.62),rgba(250,243,229,.46) 45%,rgba(246,238,222,.68))}
#landBg{opacity:.5}
#landFrame{position:fixed;inset:0;z-index:5;pointer-events:none}
#landFrame .brd{position:absolute;inset:7px;border:1.5px solid rgba(138,90,43,.28);border-radius:18px;box-shadow:inset 0 0 0 1px rgba(13,148,136,.14)}
#landFrame svg.corner{position:absolute;width:74px;height:74px;opacity:.85;filter:drop-shadow(0 2px 4px rgba(120,90,50,.18))}
#landFrame .tl{top:2px;left:2px}
#landFrame .tr{top:2px;right:2px;transform:scaleX(-1)}
#landFrame .bl{bottom:2px;left:2px;transform:scaleY(-1)}
#landFrame .br{bottom:2px;right:2px;transform:scale(-1,-1)}
#landRibbon{position:fixed;bottom:0;left:0;right:0;height:60px;z-index:5;display:flex;gap:6px;padding:0 6px 6px;pointer-events:none;
 background:linear-gradient(180deg,rgba(255,250,240,0),rgba(255,250,240,.72) 45%,rgba(255,250,240,.95))}
#landRibbon .tile{flex:1;overflow:hidden;border-radius:12px 12px 0 0;border:2px solid rgba(255,255,255,.92);border-bottom:none;box-shadow:0 -2px 10px rgba(120,90,50,.18)}
#landRibbon .tile img{width:100%;height:100%;object-fit:cover;opacity:.95}
.app{padding-bottom:74px}
@media (max-width:520px){#landRibbon{height:50px}#landFrame svg.corner{width:56px;height:56px}.app{padding-bottom:62px}</style>

<script>
const ORDER=['land/jerusalem.jpg','land/galilee.jpg','land/negev.jpg','land/shechem.jpg','land/tiberias_old.jpg','land/beersheva.jpg'];
const m=document.getElementById('landMosaic');
